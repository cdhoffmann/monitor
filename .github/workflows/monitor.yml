name: Site Monitor


on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_IVIVIV: ${{ secrets.DISCORD_WEBHOOK_IVIVIV }}
        run: python3 monitor.py

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          git diff --staged --quiet || git commit -m "chore: update snapshots [skip ci]" && git push
