name: Secret checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject committed Discord webhooks
        run: python3 scripts/check_secrets.py
      - name: Run offline regression tests
        run: python3 -m unittest discover -s tests
